# ============================================================================
#  Pulse Havana Center Cell — frontend reverse proxy
#  Install at /etc/nginx/sites-available/pulsehavana-frontend and symlink into
#  sites-enabled/. Replace DOMAIN with your real hostname, then run
#  `certbot --nginx -d DOMAIN` to obtain the TLS certificate.
#
#  The app runs in a container as `next start` bound to 127.0.0.1:3000, so it is
#  never exposed directly to the internet.
# ============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name DOMAIN;

    # Let certbot validate the domain over HTTP.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # `http2` via the legacy parameter for broad Nginx compatibility (Debian 12).
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name DOMAIN;

    ssl_certificate     /etc/letsencrypt/live/DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/DOMAIN/privkey.pem;

    # Baseline security headers.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
    }
}
